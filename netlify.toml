[build]
  base = "creative"
  command = "npm run build"
  publish = "dist"

# ADMIN_EMAILS is a list of addresses, not a secret (moo@mumoo.app is also the sender of our emails, in netlify/lib/mail.mjs).
# Without this, Netlify's secret scan finds the address in our own code and fails the build.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAILS"

# The admin is its own page. It is never indexed, and the server (not the page) decides who may use it.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Where a phone sends the song from (the QR code on the song step). Its link is in the #fragment, never sent to a server.
[[redirects]]
  from = "/phone"
  to = "/phone.html"
  status = 200

[[headers]]
  for = "/phone*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
