[build]
  base = "creative"
  command = "npm run build"
  publish = "dist"

# ADMIN_EMAILS is a list of addresses, not a secret (moo@mumoo.app is also the sender of our emails, in netlify/lib/mail.mjs).
# Without this, Netlify's secret scan finds the address in our own code and fails the build.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAILS"

# The admin is its own page. It is never indexed, and the server (not the page) decides who may use it.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Smart links: the editor is a page of the app, at its own address.
[[redirects]]
  from = "/smart-links"
  to = "/index.html"
  status = 200

# Its old address, still in fan pages shared before it moved.
[[redirects]]
  from = "/links"
  to = "/smart-links"
  status = 301

[[redirects]]
  from = "/my-smart-links"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/media"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/media/uploads"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/invoices"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/index.html"
  status = 200

# Where a phone sends the song from (the QR code on the song step). Its link is in the #fragment, never sent to a server.
[[redirects]]
  from = "/phone"
  to = "/phone.html"
  status = 200

# The public pricing page: what MUMOO costs, before anyone signs in.
[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

# The home page. Signed in, or once this browser session chose to start (creative/src/site-paths.ts), `/` is the studio; for anyone
# else it is the welcome page. Google's sign-in window and Polar's checkout come back to `/` before there is a session cookie, so
# they always reach the studio.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true
  query = {neon_popup = ":neon_popup"}

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true
  query = {checkout_id = ":checkout_id"}

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true
  query = {buy = ":buy"}

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true
  conditions = {Cookie = ["__Secure-neon-auth.session_token"]}

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true
  conditions = {Cookie = ["mumoo_start"]}

[[redirects]]
  from = "/"
  to = "/welcome.html"
  status = 200
  force = true

# Its old address.
[[redirects]]
  from = "/welcome"
  to = "/"
  status = 301

# The legal documents (creative/legal/*.md): one page, which shows the document its address names.
[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/terms-of-service"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/cookie-policy"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/acceptable-use-policy"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/refund-policy"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/ai-disclosure"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/data-processing-agreement"
  to = "/legal.html"
  status = 200

[[headers]]
  for = "/phone*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

# Built scripts, styles and fonts carry a hash of their contents in their name: a changed file gets a new name, so a browser may keep
# each one for good instead of asking the server again on every page.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The services' logos on every fan page, and our own logo and icon: not renamed when they change, so a day in the browser, then
# refreshed in the background.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
