  .paper::after { right: 18px; transform: rotate(5deg); }

  .tail { transform-origin: 388px 125px; animation: swish 1.8s ease-in-out infinite alternate; }
  .cow { animation: bob 2.4s ease-in-out infinite; }
  .bubble { transform-origin: 330px 60px; animation: wiggle 2.4s ease-in-out infinite; }
  @keyframes swish { from { transform: rotate(-7deg); } to { transform: rotate(9deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  @keyframes wiggle { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) scale(1.03); } }
  @media (prefers-reduced-motion: reduce) { .tail, .cow, .bubble { animation: none; } }
