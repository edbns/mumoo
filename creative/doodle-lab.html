<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle lab</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 14px system-ui, sans-serif; padding: 1.25rem; }
  h1 { font-size: 1.05rem; margin: 0 0 .25rem; }
  form { display: flex; gap: .75rem; flex-wrap: wrap; margin: .5rem 0 1rem; align-items: center; }
  select, input, button { font: inherit; padding: .3rem .5rem; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 1180px; }
  figure { margin: 0; }
  canvas { width: 100%; height: auto; display: block; border-radius: 6px; background: #fff; }
  figcaption { text-align: center; font-size: 12px; padding: 4px 0; color: #bbcbb2; }
</style>
</head>
<body>
<h1>Doodle lab: the real drawing code, one row for a song</h1>
<form id="form">
  <label>Genre <select id="genre"></select></label>
  <label>Voice <select id="voice"><option value="">not given</option><option>female</option><option>male</option><option>both</option></select></label>
  <label>Mood <select id="mood"><option>joyful</option><option>flirty</option><option>boastful</option><option>angry</option><option>sad</option></select></label>
  <label>Seed <input id="seed" value="a" size="4"></label>
  <label>Line <input id="line" value="I just wanna dance all night" size="28"></label>
  <label>Time (ms) <input id="ms" value="1300" size="6"></label>
  <label><input type="checkbox" id="all"> every genre (first card only)</label>
</form>
<div class="grid" id="grid"></div>
<script type="module">
  import { GENRES } from '/src/genres.ts';
  import { dealDoodle, DOODLE_FACES } from '/src/doodle-cast.ts';
  import { drawDoodle } from '/src/doodle-draw.ts';
  import { ensureFonts } from '/src/ad-fonts.ts';

  const $ = id => document.getElementById(id);
  $('genre').innerHTML = GENRES.map(group => `<option>${group.name}</option>`).join('');
  const W = 1080, H = 1920;
  async function paint() {
    await ensureFonts(DOODLE_FACES, $('line').value);
    const every = $('all').checked;
    const cards = every
      ? GENRES.map(group => ({ ...dealDoodle(group.name, $('voice').value || null, $('mood').value, $('seed').value)[0], label: group.name }))
      : dealDoodle($('genre').value, $('voice').value || null, $('mood').value, $('seed').value);
    $('grid').innerHTML = cards.map((card, i) => `<figure><canvas width="${W}" height="${H}" data-i="${i}"></canvas><figcaption>${card.label} · ${card.id} · ${card.mood} · ${card.paper} · ${card.font}</figcaption></figure>`).join('');
    cards.forEach((card, i) => {
      const canvas = document.querySelector(`canvas[data-i="${i}"]`);
      const ms = Number($('ms').value);
      drawDoodle(canvas.getContext('2d'), {
        width: W, height: H, id: card.id, paper: card.paper, mood: card.mood, font: card.font, seed: 1234 + i,
        ms, beat: Math.exp(-((ms % 500) / 110)), beatIndex: Math.floor(ms / 500), phrase: $('line').value, phraseStartMs: 1000, singing: true,
      });
    });
  }
  $('form').addEventListener('input', () => void paint());
  void paint();
</script>
</body>
</html>
